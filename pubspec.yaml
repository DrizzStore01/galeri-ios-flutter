name: ios_gallery_app
description: Gallery Android bergaya iOS yang elegan dan berfitur lengkap.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Media & Storage
  photo_manager: ^3.3.0            # Akses foto & video dari storage
  photo_view: ^0.15.0              # Pinch-to-zoom viewer
  video_player: ^2.8.6             # Video playback
  chewie: ^1.7.4                   # Video player UI wrapper
  
  # Image Editing
  image_editor_plus: ^1.0.8       # Edit foto (crop, filter, adjust)
  image_cropper: ^7.0.3           # Crop foto
  
  # State Management
  flutter_riverpod: ^2.5.1        # State management
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^13.2.0              # Declarative routing
  
  # UI Components
  sliver_tools: ^0.2.12           # Advanced sliver widgets
  flutter_staggered_grid_view: ^0.7.0  # Staggered grid layout
  shimmer: ^3.0.0                  # Loading skeleton
  lottie: ^3.1.2                   # Animasi Lottie
  animations: ^2.0.11              # Material motion animations
  
  # iOS-style Widgets
  cupertino_icons: ^1.0.8         # iOS icons
  
  # Utilities
  share_plus: ^9.0.0              # Share photo/video
  path_provider: ^2.1.3           # File system paths
  permission_handler: ^12.0.0     # Runtime permissions
  device_info_plus: ^10.1.2       # Device information
  intl: ^0.19.0                   # Internasionalisasi
  collection: ^1.18.0             # Collection utilities
  equatable: ^2.0.5               # Value equality
  uuid: ^4.4.0                    # UUID generator
  cached_network_image: ^3.3.1    # Caching images
  flutter_cache_manager: ^3.3.2   # Cache manager
  
  # Local Storage
  hive_flutter: ^1.1.0            # Local key-value storage
  hive: ^2.2.3
  
  # Haptics
  vibration: ^2.0.0               # Haptic feedback
  
  # Icons
  flutter_svg: ^2.0.10+1          # SVG support

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SFProText-Regular.ttf
        - asset: assets/fonts/SFProText-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProText-Semibold.ttf
          weight: 600
